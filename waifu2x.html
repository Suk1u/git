<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Waifu2x Aidoku Engine</title>
</head>
<body>
  <canvas id="engine"></canvas>
  <canvas id="output"></canvas>
  <canvas id="input"></canvas>
<script>
(() => {
  "use strict";

  const TILE_SIZE = 142; // Aidoku standard inner tile size
  const PADDING = 7;     // Aidoku shrinkSize / receptive field margin
  const ETA = 1.0 / 510.0; // Aidoku clipEta8 input normalization offset

  const engineCanvas = document.getElementById("engine");
  const gl = engineCanvas.getContext("webgl2", {
    alpha: false,
    antialias: false,
    depth: false,
    preserveDrawingBuffer: true,
  });

  let modelTask = null;
  let workQueue = Promise.resolve();

  if (!gl || !gl.getExtension("EXT_color_buffer_float")) {
    window.Waifu2xOffline = {
      prepare: async () => { throw new Error("设备不支持 Waifu2x WebGL2 浮点推理"); },
      run: async () => { throw new Error("设备不支持 Waifu2x WebGL2 浮点推理"); },
      status: () => null,
    };
    return;
  }

  const vertexSource = `#version 300 es
    const vec2 p[3] = vec2[3](vec2(-1., -1.), vec2(3., -1.), vec2(-1., 3.));
    void main() {
      gl_Position = vec4(p[gl_VertexID], 0., 1.);
    }`;

  const convolutionSource = `#version 300 es
    precision highp float;
    precision highp sampler2DArray;
    uniform sampler2DArray inputTensor;
    uniform sampler2D weights;
    uniform sampler2D biases;
    uniform int inputGroups;
    uniform int outputGroup;
    uniform int kernelSize;
    uniform bool fullConvolution;
    uniform bool lastLayer;
    uniform bool isFirstLayer;
    out vec4 color;

    void main() {
      ivec2 p = ivec2(gl_FragCoord.xy);
      vec4 sum = vec4(0.);
      ivec2 bound = textureSize(inputTensor, 0).xy;

      for (int ig = 0; ig < 64; ig++) {
        if (ig >= inputGroups) break;
        for (int ky = 0; ky < 4; ky++) {
          if (ky >= kernelSize) break;
          for (int kx = 0; kx < 4; kx++) {
            if (kx >= kernelSize) break;
            ivec2 q;
            if (fullConvolution) {
              ivec2 n = p + ivec2(3) - ivec2(kx, ky);
              if (any(notEqual(n & ivec2(1), ivec2(0)))) continue;
              q = n / 2;
            } else {
              q = p + ivec2(kx, ky);
            }
            if (q.x < 0 || q.y < 0 || q.x >= bound.x || q.y >= bound.y) continue;

            vec4 v = texelFetch(inputTensor, ivec3(q, ig), 0);
            if (isFirstLayer) {
              v.rgb += vec3(${ETA});
            }

            int base = ((ig * kernelSize + ky) * kernelSize + kx) * 4;
            sum.x += dot(v, texelFetch(weights, ivec2(base, outputGroup), 0));
            sum.y += dot(v, texelFetch(weights, ivec2(base + 1, outputGroup), 0));
            sum.z += dot(v, texelFetch(weights, ivec2(base + 2, outputGroup), 0));
            sum.w += dot(v, texelFetch(weights, ivec2(base + 3, outputGroup), 0));
          }
        }
      }

      sum += texelFetch(biases, ivec2(0, outputGroup), 0);
      color = lastLayer
        ? clamp(sum, 0., 1.)
        : mix(sum * 0.1, sum, greaterThanEqual(sum, vec4(0.)));
    }`;

  const displaySource = `#version 300 es
    precision highp float;
    precision highp sampler2DArray;
    uniform sampler2DArray inputTensor;
    out vec4 color;

    void main() {
      color = vec4(texelFetch(inputTensor, ivec3(ivec2(gl_FragCoord.xy), 0), 0).rgb, 1.);
    }`;

  function shader(type, source) {
    const s = gl.createShader(type);
    gl.shaderSource(s, source);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  }

  function program(fragment) {
    const p = gl.createProgram();
    gl.attachShader(p, shader(gl.VERTEX_SHADER, vertexSource));
    gl.attachShader(p, shader(gl.FRAGMENT_SHADER, fragment));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    return p;
  }

  const convolutionProgram = program(convolutionSource);
  const displayProgram = program(displaySource);
  gl.bindVertexArray(gl.createVertexArray());
  const framebuffer = gl.createFramebuffer();

  function texture2D(width, height, data) {
    const texture = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, texture);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, width, height, 0, gl.RGBA, gl.FLOAT, data);
    return texture;
  }

  function tensorTexture(width, height, groups, rgba8 = false) {
    const texture = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D_ARRAY, texture);
    gl.texParameteri(gl.TEXTURE_2D_ARRAY, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D_ARRAY, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D_ARRAY, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D_ARRAY, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texStorage3D(gl.TEXTURE_2D_ARRAY, 1, rgba8 ? gl.RGBA8 : gl.RGBA32F, width, height, groups);
    return texture;
  }

  async function fetchModelBuffer() {
    // 1. Host injected binary via window.__WAIFU2X_MODEL_BINARY__ (zero network overhead, 100% reliable)
    if (window.__WAIFU2X_MODEL_BINARY__) {
      const b64 = window.__WAIFU2X_MODEL_BINARY__;
      const bin = atob(b64);
      const buf = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
      return buf.buffer;
    }

    // 2. Try direct fetch of local waifu2x_model.bin
    try {
      const resp = await fetch("waifu2x_model.bin");
      if (resp.ok) {
        return await resp.arrayBuffer();
      }
    } catch (_) {}

    throw new Error("无法加载 waifu2x_model.bin 模型文件");
  }

  async function loadModel() {
    if (modelTask) return modelTask;
    modelTask = (async () => {
      const buffer = await fetchModelBuffer();
      const view = new DataView(buffer);
      const magic = String.fromCharCode(view.getUint8(0), view.getUint8(1), view.getUint8(2), view.getUint8(3));
      if (magic !== "W2XA") throw new Error("Waifu2x Aidoku 模型魔数无效: " + magic);

      const ver = view.getUint16(4, true);
      const count = view.getUint16(6, true);
      let offset = 8;
      const layers = [];

      for (let i = 0; i < count; i++) {
        const full = Boolean(view.getUint8(offset));
        const k = view.getUint8(offset + 1);
        // offset + 2: reserved padding (2 bytes)
        const in_c = view.getUint16(offset + 4, true);
        const out_c = view.getUint16(offset + 6, true);
        const in_g = view.getUint16(offset + 8, true);
        const out_g = view.getUint16(offset + 10, true);
        const ww = view.getUint16(offset + 12, true);
        const wh = view.getUint16(offset + 14, true);
        offset += 16;

        const weightCount = ww * wh * 4;
        const weightFloats = new Float32Array(buffer, offset, weightCount);
        offset += weightCount * 4;

        const biasCount = out_g * 4;
        const biasFloats = new Float32Array(buffer, offset, biasCount);
        offset += biasCount * 4;

        layers.push({
          full,
          kh: k,
          kw: k,
          inputGroups: in_g,
          outputGroups: out_g,
          first: (i === 0),
          last: (i + 1 === count),
          weights: texture2D(ww, wh, weightFloats),
          biases: texture2D(1, out_g, biasFloats),
        });
      }
      return layers;
    })().catch(err => {
      modelTask = null;
      throw err;
    });
    return modelTask;
  }

  function paddedTile(context, image, x, y, width, height, padding) {
    const cw = width + padding * 2;
    const ch = height + padding * 2;
    context.clearRect(0, 0, cw, ch);
    context.drawImage(image, padding - x, padding - y);
    const l = Math.max(0, padding - x);
    const t = Math.max(0, padding - y);
    const r = Math.max(0, x + width + padding - image.width);
    const b = Math.max(0, y + height + padding - image.height);

    if (l) context.drawImage(image, 0, Math.max(0, y - padding), 1, Math.min(image.height, ch), 0, t, l, ch - t - b);
    if (r) context.drawImage(image, image.width - 1, Math.max(0, y - padding), 1, Math.min(image.height, ch), cw - r, t, r, ch - t - b);
    if (t) context.drawImage(image, Math.max(0, x - padding), 0, Math.min(image.width, cw), 1, l, 0, cw - l - r, t);
    if (b) context.drawImage(image, Math.max(0, x - padding), image.height - 1, Math.min(image.width, cw), 1, l, ch - b, cw - l - r, b);
    if (l && t) context.drawImage(image, 0, 0, 1, 1, 0, 0, l, t);
    if (r && t) context.drawImage(image, image.width - 1, 0, 1, 1, cw - r, 0, r, t);
    if (l && b) context.drawImage(image, 0, image.height - 1, 1, 1, 0, ch - b, l, b);
    if (r && b) context.drawImage(image, image.width - 1, image.height - 1, 1, 1, cw - r, ch - b, r, b);
  }

  function uploadInput(canvas) {
    const texture = tensorTexture(canvas.width, canvas.height, 1, true);
    gl.bindTexture(gl.TEXTURE_2D_ARRAY, texture);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
    gl.texSubImage3D(gl.TEXTURE_2D_ARRAY, 0, 0, 0, 0, canvas.width, canvas.height, 1, gl.RGBA, gl.UNSIGNED_BYTE, canvas);
    return texture;
  }

  function bindTexture(unit, target, texture, name, p) {
    gl.activeTexture(gl.TEXTURE0 + unit);
    gl.bindTexture(target, texture);
    gl.uniform1i(gl.getUniformLocation(p, name), unit);
  }

  function applyLayer(input, width, height, layer) {
    const outWidth = layer.full ? width * 2 - 4 : width - 2;
    const outHeight = layer.full ? height * 2 - 4 : height - 2;
    const output = tensorTexture(outWidth, outHeight, layer.outputGroups);

    gl.useProgram(convolutionProgram);
    bindTexture(0, gl.TEXTURE_2D_ARRAY, input, "inputTensor", convolutionProgram);
    bindTexture(1, gl.TEXTURE_2D, layer.weights, "weights", convolutionProgram);
    bindTexture(2, gl.TEXTURE_2D, layer.biases, "biases", convolutionProgram);

    gl.uniform1i(gl.getUniformLocation(convolutionProgram, "inputGroups"), layer.inputGroups);
    gl.uniform1i(gl.getUniformLocation(convolutionProgram, "kernelSize"), layer.kh);
    gl.uniform1i(gl.getUniformLocation(convolutionProgram, "fullConvolution"), layer.full);
    gl.uniform1i(gl.getUniformLocation(convolutionProgram, "lastLayer"), layer.last);
    gl.uniform1i(gl.getUniformLocation(convolutionProgram, "isFirstLayer"), layer.first);

    gl.bindFramebuffer(gl.FRAMEBUFFER, framebuffer);
    gl.viewport(0, 0, outWidth, outHeight);

    for (let group = 0; group < layer.outputGroups; group++) {
      gl.framebufferTextureLayer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, output, 0, group);
      gl.uniform1i(gl.getUniformLocation(convolutionProgram, "outputGroup"), group);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }

    gl.deleteTexture(input);
    return { texture: output, width: outWidth, height: outHeight };
  }

  function display(tensor, width, height) {
    if (engineCanvas.width !== width) engineCanvas.width = width;
    if (engineCanvas.height !== height) engineCanvas.height = height;
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, width, height);
    gl.useProgram(displayProgram);
    bindTexture(0, gl.TEXTURE_2D_ARRAY, tensor, "inputTensor", displayProgram);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.deleteTexture(tensor);
  }

  async function infer(canvas, layers) {
    let current = { texture: uploadInput(canvas), width: canvas.width, height: canvas.height };
    for (const layer of layers) {
      current = applyLayer(current.texture, current.width, current.height, layer);
    }
    display(current.texture, current.width, current.height);
  }

  function options(value = {}) {
    return {
      scale: Number(value.scale) === 1 ? 1 : 2,
      denoise: [0, 1, 2, 3].includes(Number(value.denoise)) ? Number(value.denoise) : 0,
      format: value.format === "png" ? "png" : "jpeg",
      quality: typeof value.quality === "number" ? Math.max(0.1, Math.min(1, value.quality)) : 0.95,
    };
  }

  async function prepare(value = {}) {
    await loadModel();
    const normalized = options(value);
    return {
      backend: "webgl2",
      model: "aidoku-waifu2x-upconv7-photo2x",
      scale: normalized.scale,
      denoise: normalized.denoise,
      tiled: true,
      remote: false,
    };
  }

  async function run(dataURL, value = {}) {
    const normalized = options(value);
    if (normalized.scale === 1 && normalized.denoise === 0) {
      return dataURL.split(",")[1];
    }
    const layers = await loadModel();
    const image = new Image();
    image.src = dataURL;
    await image.decode();

    const output = document.getElementById("output");
    const outputContext = output.getContext("2d", { alpha: false });
    output.width = image.width * normalized.scale;
    output.height = image.height * normalized.scale;
    outputContext.imageSmoothingEnabled = false;
    outputContext.drawImage(image, 0, 0, output.width, output.height);
    outputContext.globalAlpha = 1.0;

    const input = document.getElementById("input");
    const inputContext = input.getContext("2d", { alpha: false });

    let tileCount = 0;
    for (let y = 0; y < image.height; y += TILE_SIZE) {
      for (let x = 0; x < image.width; x += TILE_SIZE) {
        const width = Math.min(TILE_SIZE, image.width - x);
        const height = Math.min(TILE_SIZE, image.height - y);
        const tw = width + PADDING * 2;
        const th = height + PADDING * 2;

        if (input.width !== tw) input.width = tw;
        if (input.height !== th) input.height = th;

        paddedTile(inputContext, image, x, y, width, height, PADDING);
        await infer(input, layers);

        // Model 2x output size = width * 2, height * 2
        outputContext.drawImage(
          engineCanvas,
          0, 0, width * 2, height * 2,
          x * normalized.scale, y * normalized.scale, width * normalized.scale, height * normalized.scale
        );

        tileCount++;
        if (tileCount % 4 === 0) {
          await new Promise(resolve => setTimeout(resolve, 0));
        }
      }
    }

    const mime = normalized.format === "png" ? "image/png" : "image/jpeg";
    return output.toDataURL(mime, normalized.quality).split(",")[1];
  }

  function enqueue(task) {
    const result = workQueue.then(task, task);
    workQueue = result.catch(() => undefined);
    return result;
  }

  window.Waifu2xOffline = {
    status: () => ({
      backend: "webgl2",
      model: "aidoku-waifu2x-upconv7-photo2x",
      tiled: true,
      remote: false,
    }),
    prepare: value => enqueue(() => prepare(value)),
    run: (url, value) => enqueue(() => run(url, value)),
  };
})();
</script>
</body>
</html>
